# build.yml -- build core alone for each architecture on a push and publish the build tree as the image
# ghcr.io/<owner>/core-<arch>:<commit> (+ :main). Boards start their builds from it (pdk board-image.yml,
# docs/layering.md), so they only build what they add.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  layer:
    strategy:
      fail-fast: false
      matrix:
        arch: [x32, arm]
    uses: Phorepoc/pdk/.github/workflows/board-image.yml@main
    with:
      arch: ${{ matrix.arch }}
      images: false
      publish_layer: true
    permissions:
      contents: read
      packages: write
