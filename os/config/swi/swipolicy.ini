# PHOREPOC board SWI policy (X4.84): the 2010 release's production swipolicy.ini (installationservices/swiconfig/swi)
# + the S60 keys a phone product adds (the release exports this file only for non-S60 builds).
# Phorepoc has no app signing (decided 2026-09-28): unsigned SIS files install, like self-signed ones,
# with the user-grantable capabilities below. (Signed packages still verify; the signing tools stay for targets
# that check signatures, e.g. a stock phone.)
AllowUnsigned = true
MandatePolicies = false
MandateCodeSigningExtension = false
Oid = 1.2.3.4.5.6
Oid = 2.3.4.5.6.7
DRMEnabled = true
DRMIntent = 3
OcspMandatory = false
OcspEnabled = true
AllowGrantUserCapabilities = true
AllowOrphanedOverwrite = true
UserCapabilities = NetworkServices LocalServices ReadUserData WriteUserData Location UserEnvironment 
AllowPackagePropagate = true
ApplicationShutdownTimeoutSeconds = 10
RunWaitTimeoutSeconds = 180
DeletePreinstalledFilesOnUninstall = false
MaxNumOfLogEntries =  5
RemoveOnlyWithLastDependent = true
AllowOverwriteOnRestore = false
SISCompatibleIfNoTargetDevices = true
AllowRunOnInstallUninstall = true

# Phorepoc developer mode (src/phorepoc/swi/mkswi.py): true = no signature/certificate verification -- every package is treated
# as trusted and granted the capabilities it requests (like the RomPatcher install-server patch). false = stock Symbian.
PhorepocDevMode = true
