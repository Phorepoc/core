; pheblerouter.ini -- OURS (core os/src/pheble): the HCI router's settings (z:\private\101f7989\bluetooth\).
; A board that ships BLE copies this file, sets inner_hctl_uid to its own HCTL implementation and names the router
; (0xE7015E11) as hctl_uid in its corehci_symbian.ini.
[Plugins]
; the board's real HCTL implementation uid (e.g. hctl_h5 = 0xE7015731 on the PinePhone)
inner_hctl_uid= 0x00000000
; ACL buffers kept for LE when the controller shares its BR/EDR buffers (LE_Read_Buffer_Size = 0)
le_acl_reserve= 2
