// HWRM vibra reservation policy (format: HWRMPolicy_example.ini -- priority, SID, optional FEEDBACK, optional name).
// FEEDBACK marks the clients allowed to pulse the vibra (CHWRMVibraService::PulseVibraL answers everyone else
// KErrAccessDenied). The touch feedback players run inside the window server, so WSERV is the feedback client.
10 0x10003B20 FEEDBACK WSERV
