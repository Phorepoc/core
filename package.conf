# package.conf -- core's one installable package, the browser frontend (os/src/phebrowser), as SIS files: the pdk's package.yml
# builds them for browser-release.yml. Every image carries the frontend too; the SIS updates it without a new image (it installs
# over the image's copy: the image's ROM stub, registry rom_stub) and runs on older Symbian^3 phones. No engine and no Qt in it:
# the engines are their own Catalogue packages.
NAME=phebrowser
ARCHES="arm x32"
# webengine: the engine interface (headers only)
REPOS_arm="webengine"
REPOS_x32="webengine"
COMPONENTS_arm="phebrowser_arm"
COMPONENTS_x32="phebrowser"
ADDON=0
